<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Controle de Recalque - PCH PIAU</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a1711;
            --bg-panel: #11261d;
            --bg-card: #1a382a;
            --primary: #2ecc71;
            --primary-hover: #27ae60;
            --text-main: #e8f5e9;
            --text-muted: #a5d6a7;
            --border: #2d5a42;
            --danger: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 380px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .header {
            padding: 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 4px;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover {
            background-color: var(--primary);
            color: #000;
        }
        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Import Section */
        .import-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* Map Area */
        #map-container {
            flex: 1;
            position: relative;
        }
        #map { width: 100%; height: 100%; }

        /* Leaflet Dark Theme Overrides */
        .leaflet-popup-content-wrapper {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .leaflet-popup-tip { background-color: var(--bg-card); }
        .leaflet-popup-content h3 { color: var(--primary); margin-bottom: 10px; }
        
        .popup-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .popup-actions button {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-edit { background-color: #f39c12; color: #000; }
        
        /* Modal Edit */
        #editModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            border: 1px solid var(--border);
        }
        .modal-content h2 { margin-bottom: 15px; color: var(--primary); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="header">
            <h1>DamGeoMonitor</h1>
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 5px;">Controle de Recalque - PCH PIAU</p>
        </div>

        <div class="content">
            <h3 style="margin-bottom: 15px; color: var(--primary);">Integração GitHub</h3>
            <button class="btn btn-outline" onclick="exportarJSON()">💾 Exportar dados.json</button>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px;">
                Salve o arquivo exportado na raiz do seu repositório GitHub. O sistema carregará os dados automaticamente.
            </p>

            <h3 style="margin-bottom: 15px; color: var(--primary);">Importação em Lote</h3>
            <div class="form-group">
                <label>Cole os dados (Nome, N, E, H):</label>
                <textarea id="importData" rows="6" placeholder="M16PIA&#9;7622823,527&#9;665456,7838&#9;632,6084"></textarea>
            </div>
            <button class="btn" onclick="processarImportacao()">Processar Lote</button>
            
            <div class="import-section">
                <h3 style="margin-bottom: 15px; color: var(--primary);">Marcos Inseridos (<span id="contador">0</span>)</h3>
                <div id="lista-marcos" style="font-size: 0.85rem; max-height: 200px; overflow-y: auto;">
                    <!-- Lista será gerada via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- MAPA -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="editModal">
        <div class="modal-content">
            <h2>Editar Marco</h2>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Nome do Marco</label>
                <input type="text" id="edit-nome">
            </div>
            <div class="form-group">
                <label>Norte (N)</label>
                <input type="text" id="edit-n">
            </div>
            <div class="form-group">
                <label>Leste (E)</label>
                <input type="text" id="edit-e">
            </div>
            <div class="form-group">
                <label>Altitude (H)</label>
                <input type="text" id="edit-h">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" onclick="salvarEdicao()">Salvar</button>
                <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <script>
        // Configuração Proj4js - UTM Zona 23S (SIRGAS 2000)
        proj4.defs("EPSG:31983", "+proj=utm +zone=23 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");

        // Banco de Dados Local pré-carregado com as coordenadas padrão
        let marcos = [
            { id: 1, nome: "1", e: 665463.978, n: 7622824.952, h: 0 },
            { id: 2, nome: "2", e: 665444.811, n: 7622832.631, h: 0 },
            { id: 3, nome: "3", e: 665432.512, n: 7622834.494, h: 0 },
            { id: 4, nome: "4", e: 665402.590, n: 7622839.288, h: 0 },
            { id: 5, nome: "5", e: 665378.372, n: 7622842.988, h: 0 },
            { id: 6, nome: "6", e: 665354.589, n: 7622846.768, h: 0 },
            { id: 7, nome: "7", e: 665349.274, n: 7622849.616, h: 0 },
            { id: 8, nome: "8", e: 665344.959, n: 7622856.053, h: 0 },
            { id: 9, nome: "9", e: 665357.849, n: 7622889.012, h: 0 },
            { id: 10, nome: "10", e: 665355.113, n: 7622867.927, h: 0 },
            { id: 11, nome: "11", e: 665364.998, n: 7622857.646, h: 0 },
            { id: 12, nome: "12", e: 665391.560, n: 7622853.435, h: 0 },
            { id: 13, nome: "13", e: 665421.359, n: 7622849.022, h: 0 },
            { id: 14, nome: "14", e: 665435.854, n: 7622846.671, h: 0 },
            { id: 15, nome: "15", e: 665450.184, n: 7622848.296, h: 0 },
            { id: 16, nome: "16", e: 665447.172, n: 7622860.441, h: 0 },
            { id: 17, nome: "17", e: 665437.669, n: 7622858.443, h: 0 },
            { id: 18, nome: "18", e: 665423.065, n: 7622860.582, h: 0 },
            { id: 19, nome: "19", e: 665393.480, n: 7622865.163, h: 0 },
            { id: 20, nome: "20", e: 665366.524, n: 7622870.222, h: 0 },
            { id: 21, nome: "21", e: 665364.979, n: 7622878.398, h: 0 },
            { id: 22, nome: "22", e: 665372.419, n: 7622895.922, h: 0 },
            { id: 23, nome: "23", e: 665443.724, n: 7622873.059, h: 0 },
            { id: 24, nome: "24", e: 665439.166, n: 7622870.258, h: 0 },
            { id: 25, nome: "25", e: 665425.090, n: 7622872.225, h: 0 },
            { id: 26, nome: "26", e: 665395.335, n: 7622876.743, h: 0 },
            { id: 27, nome: "27", e: 665407.346, n: 7622894.215, h: 0 },
            { id: 28, nome: "28", e: 665415.151, n: 7622597.597, h: 0 },
            { id: 29, nome: "29", e: 665465.770, n: 7622684.102, h: 0 }
        ];
        
        let map;
        let layerGroup;

        // Inicializa o Mapa ESRI
        function initMap() {
            map = L.map('map').setView([-19.6, -44.2], 15);
            layerGroup = L.layerGroup().addTo(map);

            // Mapa Base: ESRI World Imagery
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }).addTo(map);
        }

        // Função Rigorosa para Converter Números Brasileiros
        function parseBR(str) {
            if (!str) return 0;
            let val = str.toString().trim();
            val = val.replace(/\./g, '');
            val = val.replace(',', '.');
            return parseFloat(val);
        }

        // Importação em Lote
        function processarImportacao() {
            const raw = document.getElementById('importData').value;
            if (!raw) return;

            const linhas = raw.split('\n');
            let adicionados = 0;

            linhas.forEach(linha => {
                const colunas = linha.split(/\t/);
                if (colunas.length >= 4) {
                    const nome = colunas[0].trim();
                    let n = parseBR(colunas[1]);
                    let e = parseBR(colunas[2]);
                    const h = parseBR(colunas[3]);

                    if (e > n) {
                        let temp = n;
                        n = e;
                        e = temp;
                    }

                    const existe = marcos.findIndex(m => m.nome === nome);
                    const novoMarco = { id: Date.now() + Math.random(), nome, n, e, h };
                    
                    if (existe > -1) {
                        marcos[existe] = novoMarco;
                    } else {
                        marcos.push(novoMarco);
                    }
                    adicionados++;
                }
            });

            document.getElementById('importData').value = '';
            atualizarInterface();
            alert(`${adicionados} marcos processados com sucesso!`);
        }

        // Atualiza o Mapa e a Lista
        function atualizarInterface() {
            layerGroup.clearLayers();
            const lista = document.getElementById('lista-marcos');
            lista.innerHTML = '';
            document.getElementById('contador').innerText = marcos.length;

            if (marcos.length === 0) return;

            let bounds = [];

            marcos.forEach(m => {
                const coord = proj4("EPSG:31983", "EPSG:4326", [m.e, m.n]);
                const lat = coord[1];
                const lon = coord[0];

                bounds.push([lat, lon]);

                const marker = L.circleMarker([lat, lon], {
                    radius: 6,
                    fillColor: "#2ecc71",
                    color: "#fff",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(layerGroup);

                const popupContent = `
                    <h3>${m.nome}</h3>
                    <b>N:</b> ${m.n.toFixed(3)}<br>
                    <b>E:</b> ${m.e.toFixed(3)}<br>
                    <b>H:</b> ${m.h.toFixed(4)}<br>
                    <div class="popup-actions">
                        <button class="btn-edit" onclick="abrirEdicao(${m.id})">✏️ Editar</button>
                        <button class="btn-danger" onclick="excluirMarco(${m.id})">🗑️ Apagar</button>
                    </div>
                `;
                marker.bindPopup(popupContent);

                lista.innerHTML += `
                    <div style="padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
                        <span><b>${m.nome}</b> (H: ${m.h.toFixed(3)})</span>
                        <a href="#" onclick="map.flyTo([${lat}, ${lon}], 18)" style="color: var(--primary);">Ver</a>
                    </div>
                `;
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds);
            }
        }

        function abrirEdicao(id) {
            const m = marcos.find(x => x.id === id);
            if(m) {
                document.getElementById('edit-id').value = m.id;
                document.getElementById('edit-nome').value = m.nome;
                document.getElementById('edit-n').value = m.n.toFixed(3).replace('.', ',');
                document.getElementById('edit-e').value = m.e.toFixed(3).replace('.', ',');
                document.getElementById('edit-h').value = m.h.toFixed(4).replace('.', ',');
                document.getElementById('editModal').style.display = 'flex';
                map.closePopup();
            }
        }

        function fecharModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function salvarEdicao() {
            const id = parseFloat(document.getElementById('edit-id').value);
            const idx = marcos.findIndex(x => x.id === id);
            
            if(idx > -1) {
                marcos[idx].nome = document.getElementById('edit-nome').value;
                marcos[idx].n = parseBR(document.getElementById('edit-n').value);
                marcos[idx].e = parseBR(document.getElementById('edit-e').value);
                marcos[idx].h = parseBR(document.getElementById('edit-h').value);
                atualizarInterface();
                fecharModal();
            }
        }

        function excluirMarco(id) {
            if(confirm("Tem certeza que deseja apagar este marco?")) {
                marcos = marcos.filter(x => x.id !== id);
                atualizarInterface();
            }
        }

        function exportarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(marcos, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "dados.json");
            dlAnchorElem.click();
        }

        async function carregarDoGitHub() {
            try {
                const res = await fetch('dados.json');
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        marcos = data;
                        atualizarInterface();
                        console.log("Dados atualizados carregados com sucesso do repositório.");
                    }
                }
            } catch(e) {
                console.log("Mantendo os dados pré-carregados, dados.json não encontrado ou rodando offline.");
            }
        }

        // Boot do Sistema
        window.onload = () => {
            initMap();
            atualizarInterface(); // Desenha os 29 pontos iniciais imediatamente
            carregarDoGitHub(); // Tenta sobrepor com dados do GitHub, se existirem
        };
    </script>
</body>
</html>
